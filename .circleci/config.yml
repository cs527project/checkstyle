version: 2.1

jobs:
  run-tests:
    docker:
      - image: cimg/openjdk:21.0.6
    steps:
      - checkout

      - restore_cache:
          name: Restore Maven repo and wrapper cache
          keys:
            - mvn-cache-{{ checksum "pom.xml" }}

      - run:
          name: Run Maven tests
          command: |
            ./mvnw -B test

      - run:
          name: Collect JUnit XML results
          command: |
            mkdir -p ~/test-results/junit
            # copy Surefire/Failsafe reports from all modules into ~/test-results/junit
            find . -type f \( -path "*/target/surefire-reports/*.xml" -o -path "*/target/failsafe-reports/*.xml" \) -exec cp {} ~/test-results/junit/ \;

      - store_test_results:
          path: ~/test-results

      - save_cache:
          name: Save Maven repo and wrapper cache
          key: mvn-cache-{{ checksum "pom.xml" }}
          paths:
            - .m2
            - .mvn/wrapper

workflows:
  test:
    jobs:
      - run-tests
